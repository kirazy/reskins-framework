reskins-framework-tier-mapping=Vyberte mezi následujícími mapování úrovní.\n\n[font=default-semibold]Tradiční[/font]: úroveň mapování odpovídá názvům, takže vstupy 1, 2 a 3 v sérii budou pořád mapovat na úrovni 1, 2 a 3, a tak dále.\nPro příklad, jaderné reaktory začínají na úrovni 1.\n\n[font=default-semibold]Postup[/font]: úroveň mapování odpovídá hernímu postupu, takže předměty získané později, které vyžaduji náročnější materiály, budou mapovány na vyšší úrovni.\nPro příklad, jaderné reaktory začínají na úrovni 3.
