[mod-setting-description]
reskins-framework-tier-label-style=Legt den Stil der Stufenmarkierung fest.
reskins-framework-tier-mapping=Legt die Zuordnung der Stufe fest.\n\n[font=default-semibold]Traditionell[/font]: Stufenzuordnung geschieht nach Name, sodass die ersten drei Maschinen einer Serie immer den Stufen 1, 2 und 3 entsprechen.\nZum Beispiel würden Kernreaktoren mit Stufe 1 beginnen.\n\n[font=default-semibold]Fortschritt[/font]: Stufenzuordnung folgt Spielfortschritt, sodass spätere Maschinen, die komplexere Komponenten benötigen, höheren Stufen entsprechen.\nZum Beispiel würden Kernreaktoren mit Stufe 3 beginnen.
reskins-framework-custom-colors-tier-0=Legt die Farbe für Stufe 0 fest.
reskins-framework-custom-colors-tier-1=Legt die Farbe für Stufe 1 fest.
reskins-framework-custom-colors-tier-2=Legt die Farbe für Stufe 2 fest.
reskins-framework-custom-colors-tier-3=Legt die Farbe für Stufe 3 fest.
reskins-framework-custom-colors-tier-4=Legt die Farbe für Stufe 4 fest.
reskins-framework-custom-colors-tier-5=Legt die Farbe für Stufe 5 fest.
reskins-framework-custom-colors-tier-6=Legt die Farbe für Stufe 6 fest.

