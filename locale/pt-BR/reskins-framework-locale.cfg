reskins-framework-custom-colors-tier-4=Escolha uma cor para o Nível 4.
reskins-framework-custom-colors-tier-5=Escolha uma cor para o Nível 5.
reskins-framework-custom-colors-tier-6=Escolha uma cor para o Nível 6.

