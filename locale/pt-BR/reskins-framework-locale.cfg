[mod-setting-description]
reskins-framework-tier-label-style=Escolha o estilo do rótulo de nível.
reskins-framework-tier-mapping=Escolha a partir dos seguintes mapeamentos de níveos.\n\n[font=default-semibold]Tradicional[/font]: mapeamento de níveis seguem os nomes, então as entradas 1, 2 e 3 em sequência sempre serão mapeadas para os níveis 1, 2 e 3, e aí para frente.\nPor exemplo, reatores nucleares começando no nível 1.\n\n[font=default-semibold]Progressão[/font]: mapeamento de níveis seguem a progressão do jogo, então itens obtidos depois, requerindo materiais mais complexos, começarão mapeados com níveis mais altos.\nPor exemplo, reatores nucleares começando no nível 3.
reskins-framework-custom-colors-tier-0=Escolha uma cor para o Nível 0.
reskins-framework-custom-colors-tier-1=Escolha uma cor para o Nível 1.
reskins-framework-custom-colors-tier-2=Escolha uma cor para o Nível 2.
