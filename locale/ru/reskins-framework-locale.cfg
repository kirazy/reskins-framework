[mod-setting-description]
reskins-framework-tier-label-style=Определяет стиль уровневых меток.
reskins-framework-tier-mapping=Устанавливает, как уровни даются зданиям и предметам.\n\n[font=default-semibold]Традиционный[/font]: Уровень следует именам. Здания 1, 2 и 3 будут определены, как уровни 1, 2 и 3 и так далее.\nНапример, уровни зданий ядерных реакторов будут начинаться с 1-го.\n\n[font=default-semibold]Прогрессивный[/font]: Сопоставление уровней следует прогрессу игры. Полученные в середине игры здания и предметы, требующие более сложных материалов, будут сопоставлены с высокими уровнями.\nНапример, ядерные реакторы будут начинаться с уровня 3.
reskins-framework-custom-colors-tier-0=Устанавливает цвет для 0-го уровня.
reskins-framework-custom-colors-tier-1=Устанавливает цвет для 1-го уровня.
reskins-framework-custom-colors-tier-2=Устанавливает цвет для 2-го уровня.
reskins-framework-custom-colors-tier-3=Устанавливает цвет для 3-го уровня.
reskins-framework-custom-colors-tier-4=Устанавливает цвет для 4-го уровня.
reskins-framework-custom-colors-tier-5=Устанавливает цвет для 5-го уровня.
reskins-framework-custom-colors-tier-6=Устанавливает цвет для 6-го уровня.

