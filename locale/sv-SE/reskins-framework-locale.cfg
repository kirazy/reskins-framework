[mod-setting-description]
reskins-framework-tier-label-style=Ställer in nivåmarkeringarnas stil.
reskins-framework-tier-mapping=Ställer in hur byggnader och föremål delas in i nivåer.\n\n[font=default-semibold]Traditionell[/font]: nivåindelningen följer namnen. Nummer 1, 2 och 3 i en serie motsvarar nivå 1, 2 och 3, och så vidare.\nTill exempel börjar kärnreaktorer på nivå 1.\n\n[font=default-semibold]Progression[/font]: nivåindelningen följer spelets utveckling. Föremål som fås senare och kräver mer komplexa material börjar på högre nivåer.\nTill exempel börjar kärnreaktorer på nivå 3.
reskins-framework-use-custom-tier-colors=[img=utility.warning_icon] Egna färger använder många bildlager för föremål och objekt, vilket kraftigt ökar antalet spritebilder på skärmen. Det kan försämra prestandan.\n\nAktiverar anpassning av nivåernas färger med färgväljarna nedan.
reskins-framework-custom-colors-tier-0=Ställer in färgen för nivå 0.
reskins-framework-custom-colors-tier-1=Ställer in färgen för nivå 1.
