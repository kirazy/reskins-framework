[mod-setting-description]
reskins-framework-tier-label-style=Визначає стиль рівневих позначок.
reskins-framework-tier-mapping=Встановлює, як рівні даються будівлям і предметам.\n\n[font=default-semibold]Традиційний[/font]Будівлі 1, 2 і 3 будуть визначені як рівні 1, 2 і 3 і так далі.\nНаприклад, рівні будівель ядерних реакторів будуть починатися з 1-го.\n\n[font=default-semibold]Прогресивний[/font]Зіставлення рівнів слід прогресу гри Отримані в середині гри будівлі та предмети, що вимагають складніших матеріалів, будуть зіставлені з високими рівнями.\nНаприклад, ядерні реактори починаються з рівня 3.
reskins-framework-custom-colors-tier-0=Встановлює колір для 0-го рівня.
reskins-framework-custom-colors-tier-1=Встановлює колір для 1-го рівня.
reskins-framework-custom-colors-tier-2=Встановлює колір для 2-го рівня.
reskins-framework-custom-colors-tier-3=Встановлює колір для 3-го рівня.
reskins-framework-custom-colors-tier-4=Встановлює колір для 4-го рівня.
reskins-framework-custom-colors-tier-5=Встановлює колір для 5-го рівня.
reskins-framework-custom-colors-tier-6=Встановлює колір для 6-го рівня.

