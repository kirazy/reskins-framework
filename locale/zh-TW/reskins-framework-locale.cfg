[mod-setting-description]
reskins-framework-tier-label-style=設置層標籤的樣式。
reskins-framework-tier-mapping=設置如何映射結構和項目的層。\n \n [font=default-semibold]傳統的[/font]：層映射遵循名稱。系列中的條目1、2和3映射到第1、2和3層，依此類推。\n例如，從第1層開始的核反應堆。\n \n [font=default-semibold] Progression [/font]：層級映射隨遊戲進度而變化。後來獲得的需要更複雜材料的物品開始映射到更高的層次。\n例如，從第3層開始的核反應堆。
reskins-framework-custom-colors-tier-0=設置第0層的顏色。
reskins-framework-custom-colors-tier-1=設置第1層的顏色。
reskins-framework-custom-colors-tier-2=設置第2層的顏色。
reskins-framework-custom-colors-tier-3=設置第3層的顏色。
reskins-framework-custom-colors-tier-4=設置第4層的顏色。
reskins-framework-custom-colors-tier-5=設置第5層的顏色。
reskins-framework-custom-colors-tier-6=設置第6層的顏色。

